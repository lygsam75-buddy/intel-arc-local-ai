<svg viewBox="0 0 680 298" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
<title>同是 32 GB 显存，每 GB 卖多少钱</title>
<desc>四张 32 GB 涡轮卡按每 GB 显存单价排列：B65 每 GB 312 元、B70 594 元、RTX PRO 4500 969 元、RTX 5090 涡轮版 1,656 元；B65 是这四张里的地板价，5090 是它的 5.3 倍。</desc>
<text x="40" y="32" font-size="15" font-weight="600" fill="#2C2C2A">同是 32 GB 显存，每 GB 卖多少钱</text>
<text x="40" y="52" font-size="12" fill="#5F5E5A">横条越长 = 这一 GB 越贵；数字为 2026-10 电商挂牌价</text>
<line x1="218" y1="76" x2="218" y2="244" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="40" y="101" font-size="12.5" fill="#2C2C2A">Arc Pro B65 · 32 GB · ¥9,999</text>
<rect x="218" y="86" width="59.9" height="22" fill="#185FA5"/>
<text x="548" y="102" font-size="13" font-weight="600" fill="#185FA5">¥312/GB</text>
<text x="40" y="145" font-size="12.5" fill="#2C2C2A">Arc Pro B70 · 32 GB · ¥18,999</text>
<rect x="218" y="130" width="114.0" height="22" fill="#378ADD"/>
<text x="548" y="146" font-size="13" font-weight="600" fill="#2A6CB0">¥594/GB</text>
<text x="40" y="189" font-size="12.5" fill="#2C2C2A">RTX PRO 4500 · ¥30,999</text>
<rect x="218" y="174" width="186.0" height="22" fill="#888780"/>
<text x="548" y="190" font-size="13" font-weight="600" fill="#5F5E5A">¥969/GB</text>
<text x="40" y="233" font-size="12.5" fill="#2C2C2A">RTX 5090 涡轮版 · ¥52,999</text>
<rect x="218" y="218" width="318.0" height="22" fill="#D85A30"/>
<text x="548" y="234" font-size="13" font-weight="600" fill="#D85A30">¥1,656/GB</text>
<text x="40" y="266" font-size="12.5" fill="#444441">B65 的 ¥312 是这四张里的地板价；5090 是它的 5.3 倍，功耗 575 W 也是 B65 的 2.88 倍。</text>
<text x="40" y="286" font-size="11.5" fill="#5F5E5A">价格仅作性价比比较的统一基准；实际成交价随平台优惠浮动，下单前请现查。</text>
</svg>
