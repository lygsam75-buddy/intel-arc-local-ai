<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>image-bench-dashboard</title>
<style>
  :root { --ink: #2C2C2A; --muted: #5F5E5A; --grid: #E5E4E0; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px 24px 40px; background: #FAFAF8; color: var(--ink);
         font-family: "Microsoft YaHei", "Segoe UI", "Noto Sans SC", sans-serif; }
  .wrap { max-width: 1080px; margin: 0 auto; }
  h1 { font-size: 21px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 12.5px; margin: 0 0 18px; }
  .toolbar { display: flex; gap: 8px; margin: 0 0 18px; }
  .toolbar button { border: 1px solid var(--grid); background: #fff; color: var(--ink);
    border-radius: 6px; padding: 5px 13px; font-size: 12.5px; cursor: pointer; }
  .toolbar button.on { background: #2F6FBA; border-color: #2F6FBA; color: #fff; }
  .panel { background: #fff; border: 1px solid var(--grid); border-radius: 10px;
           padding: 16px 18px 10px; margin: 0 0 18px; }
  .panel h2 { font-size: 14px; margin: 0 0 12px; }
  .row { display: grid; grid-template-columns: 300px 1fr; gap: 10px; align-items: center;
         padding: 5px 0; border-top: 1px dashed var(--grid); }
  .row:first-of-type { border-top: 0; }
  .lbl { font-size: 11.5px; line-height: 1.35; color: var(--ink); }
  .bars { position: relative; height: 56px; }
  .bar { position: absolute; height: 9px; border-radius: 2px; min-width: 1px; }
  .val { position: absolute; font-size: 9.5px; color: var(--muted); white-space: nowrap; }
  .na { position: absolute; font-size: 9.5px; color: var(--muted); cursor: default; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; margin: 4px 0 14px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; opacity: 1; }
  .chip.off { opacity: .3; }
  .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .notes { font-size: 11px; color: var(--muted); line-height: 1.7; }
  .foot { font-size: 11px; color: var(--muted); margin: 8px 2px 0; line-height: 1.6; }
  #tip { position: fixed; pointer-events: none; background: #2C2C2A; color: #fff; font-size: 11px;
         padding: 7px 10px; border-radius: 6px; max-width: 340px; line-height: 1.55; display: none; z-index: 9; }
</style>
</head>
<body>

  <div class="legend" id="legend"></div>
  <div class="panel"><h2 id="h-img"></h2><div id="p-img"></div></div>
  <div class="panel"><h2 id="h-mus"></h2><div id="p-mus"></div></div>
  <div class="notes" id="notes"></div>
  <p class="foot" id="foot"></p>
</div>

z": "8.73 至 8.74", "te": "8.73 to 8.74", "n": null, "s": "2026-10-21_b65-32g_krea-2-turbo-int8_convrot-b65k2-comfyui.json"}, "B70": {"v": 6.04, "tz": "6.03 至 6.07", "te": "6.03 to 6.07", "n": null, "s": "2026-10-17_b70-32g_krea-2-turbo-int8_convrot-b70k2int8fix-comfyui.json"}}}, {"zh": "Krea-2 Turbo · 1280×768 · 8 步 · int8", "en": "Krea-2 Turbo · 1280×768 · 8 steps · int8", "cells": {"B70": {"v": 6.54, "tz": "6.54", "te": "6.54", "n": null, "s": "2026-10-17_b70-32g_krea-2-turbo-int8_convrot-b70k2res-comfyui.json"}}}, {"zh": "Krea-2 Turbo · 1536×1024 · 8 步 · int8", "en": "Krea-2 Turbo · 1536×1024 · 8 steps · int8", "cells": {"B70": {"v": 11.13, "tz": "11.13", "te": "11.13", "n": null, "s": "2026-10-17_b70-32g_krea-2-turbo-int8_convrot-b70k2res2-comfyui.json"}}}, {"zh": "Krea-2 Turbo · 1280×720 · bf16", "en": "Krea-2 Turbo · 1280×720 · bf16", "cells": {"B50": {"v": null, "tz": "❌", "te": "❌", "n": "e", "s": "2026-10-16_b50-16g_krea-2-turbo-bf16-k2bf16-comfyui.json"}, "B60": {"v": null, "tz": "未测", "te": "not measured", "n": "i", "s": null}, "B65": {"v": 167.47, "tz": "167.37 至 167.56", "te": "167.37 to 167.56", "n": "d", "s": "2026-10-21_b65-32g_krea-2-turbo-bf16-b65k2b16-comfyui.json"}, "B70": {"v": 127.74, "tz": "127.74", "te": "127.74", "n": "d", "s": "2026-10-19_b70-32g_krea-2-turbo-bf16-b70pw-comfyui.json"}}}], "mus": [{"zh": "Music 3 · int8 DiT + int8 TE", "en": "Music 3 · int8 DiT + int8 TE", "cells": {"B50": {"v": 216.82, "tz": "216.82", "te": "216.82", "n": null, "s": "2026-10-16_b50-16g_minimax-music-3-int8_convrot-m3i8-comfyui.json"}, "B60": {"v": 145.37, "tz": "144.89 至 145.84", "te": "144.89 to 145.84", "n": null, "s": "2026-10-20_b60-24g_minimax-music-3-int8_convrot-b60m3-comfyui.json"}, "B65": {"v": 164.56, "tz": "164.56 / 198.31", "te": "164.56 / 198.31", "n": "f", "s": "2026-10-21_b65-32g_minimax-music-3-int8_convrot-b65m3i8te8-comfyui.json"}, "B70": {"v": 64.02, "tz": "61.35 至 66.69", "te": "61.35 to 66.69", "n": null, "s": "2026-10-17_b70-32g_minimax-music-3-int8_convrot-b70m3teint8b-comfyui.json"}}}, {"zh": "Music 3 · int8 DiT + bf16 TE", "en": "Music 3 · int8 DiT + bf16 TE", "cells": {"B50": {"v": 218.21, "tz": "218.21", "te": "218.21", "n": null, "s": "2026-10-17_b50-16g_minimax-music-3-int8_convrot-tebf16-comfyui.json"}, "B65": {"v": 236.51, "tz": "236.51 / 301.14", "te": "236.51 / 301.14", "n": "df", "s": "2026-10-21_b65-32g_minimax-music-3-int8_convrot-b65m3-comfyui.json"}, "B70": {"v": 61.92, "tz": "61.83 至 61.97", "te": "61.83 to 61.97", "n": null, "s": "2026-10-17_b70-32g_minimax-music-3-int8_convrot-b70m3tebf16b-comfyui.json"}}}, {"zh": "Music 3 · int8 DiT + bf16 TE · reserve 2", "en": "Music 3 · int8 DiT + bf16 TE · reserve 2", "cells": {"B65": {"v": 180.53, "tz": "180.21 至 180.85", "te": "180.21 to 180.85", "n": null, "s": "2026-10-21_b65-32g_minimax-music-3-int8_convrot-b65m3res2-comfyui.json"}}}, {"zh": "Music 3 · fp16 DiT + int8 TE", "en": "Music 3 · fp16 DiT + int8 TE", "cells": {"B50": {"v": 282.29, "tz": "282.29", "te": "282.29", "n": null, "s": "2026-10-16_b50-16g_minimax-music-3-fp16-m3f16-comfyui.json"}, "B70": {"v": 78.73, "tz": "78.70 至 78.76", "te": "78.70 to 78.76", "n": null, "s": "2026-10-17_b70-32g_minimax-music-3-fp16-b70m3fp16teint8-comfyui.json"}}}, {"zh": "Music 3 · fp16 DiT + bf16 TE", "en": "Music 3 · fp16 DiT + bf16 TE", "cells": {"B65": {"v": 225.66, "tz": "223.39 至 227.94", "te": "223.39 to 227.94", "n": null, "s": "2026-10-21_b65-32g_minimax-music-3-fp16-b65m3f16-comfyui.json"}, "B70": {"v": 81.34, "tz": "81.34", "te": "81.34", "n": "g", "s": "2026-10-17_b70-32g_minimax-music-3-fp16-b70m3fp16tebf16-comfyui.json"}}}], "notes": {"zh": {"a": "B50 每轮重载 TE 3,837.8 MB", "b": "旧栈读数（torch213 · 无 int8fix；补丁后同卡 int8 为 10.63 s）", "c": "1024×1024（16 GB 交付形态），与其余 Krea-2 行不同分辨率", "d": "每轮重装（B60 Krea-2：DiT 12.6 GB；Krea-2 bf16 与 Music reserve 4：loads=3）", "df": "每轮重装（loads=3）＋两轮未收敛，取快者", "e": "采样后设备失联（UR_RESULT_ERROR_DEVICE_LOST）", "f": "两轮未收敛，取快者", "g": "临界态：跑得通但不稳", "i": "B60 在机那批只排了 int8，已拆卡补不了", "k": "5120 只跑 3 轮（first + 2×resident），换提示词未跑"}, "en": {"a": "B50 reloads the TE every round (3,837.8 MB)", "b": "old-stack reading (torch213 · no int8fix; after the patch int8 is 10.63 s on the same card)", "c": "1024×1024 (the 16 GB delivery form), a different resolution from the other Krea-2 rows", "d": "reloads every round (B60 Krea-2: the 12.6 GB DiT; Krea-2 bf16 and Music reserve 4: loads=3)", "df": "reloads every round (loads=3) + two rounds did not converge; the faster one is taken", "e": "device lost after sampling (UR_RESULT_ERROR_DEVICE_LOST)", "f": "two rounds did not converge; the faster one is taken", "g": "borderline: runs but unstable", "i": "the B60 in-machine batch only scheduled int8, and the card has been pulled", "k": "5120 has only 3 rounds (first + 2×resident); the new-prompt round was not run"}}, "t": {"zh": {"title": "总测试项 · 四卡稳态对比", "sub": "ComfyUI int8fix 栈 · resident 稳态 · 出图为秒/张、出音乐为秒/首（120 s · 30 步）", "img": "出图（稳态 s/张）", "mus": "出音乐（稳态 s/首）", "cards": "卡型", "notes": "表注", "value": "稳态", "source": "来源批号", "foot": "柱高 = 稳态读数（区间格取中值/快者，与 §3.0 主表同源）；悬停看批号与条件。空白格 = 未测或失败，见表注。"}, "en": {"title": "Master summary · steady state across four cards", "sub": "ComfyUI int8fix stack · resident steady state · s/image for images, s/song for music (120 s · 30 steps)", "img": "Image generation (s/image)", "mus": "Music generation (s/song)", "cards": "Card", "notes": "Notes", "value": "Steady state", "source": "Source batch", "foot": "Bar height = the steady-state reading (midpoint/fast round for ranges, same source as the §3.0 master table); hover for batch and conditions. Blank cells = not measured or failed, see notes."}}, "cards": ["B50", "B60", "B65", "B70"], "colors": {"B50": "#B9C6D8", "B60": "#6E97C6", "B65": "#3F7CC0", "B70": "#2F6FBA"}};
let lang = "zh";
const off = {};
const tip = document.getElementById("tip");

function fmt(v) { return v == null ? "" : (Math.round(v * 100) / 100).toFixed(2).replace(/\.00$/, ""); }

function render() {
  const t = DATA.t[lang];
  document.getElementById("title").textContent = t.title;
  document.getElementById("sub").textContent = t.sub;
  document.getElementById("h-img").textContent = t.img;
  document.getElementById("h-mus").textContent = t.mus;
  document.getElementById("foot").textContent = t.foot;
  document.getElementById("b-zh").className = lang === "zh" ? "on" : "";
  document.getElementById("b-en").className = lang === "en" ? "on" : "";

  const leg = document.getElementById("legend");
  leg.innerHTML = "";
  DATA.cards.forEach(c => {
    const el = document.createElement("span");
    el.className = "chip" + (off[c] ? " off" : "");
    el.innerHTML = '<span class="sw" style="background:' + DATA.colors[c] + '"></span>' + c;
    el.onclick = () => { off[c] = !off[c]; render(); };
    leg.appendChild(el);
  });

  const max = {};
  ["img", "mus"].forEach(k => {
    max[k] = 0;
    DATA[k].forEach(r => DATA.cards.forEach(c => {
      const cell = r.cells[c];
      if (cell && cell.v != null && !off[c]) max[k] = Math.max(max[k], cell.v);
    }));
    max[k] = (max[k] || 1) * 1.02;
  });

  ["img", "mus"].forEach(k => {
    const host = document.getElementById("p-" + k);
    host.innerHTML = "";
    DATA[k].forEach(r => {
      const row = document.createElement("div");
      row.className = "row";
      const lbl = document.createElement("div");
      lbl.className = "lbl";
      lbl.textContent = lang === "zh" ? r.zh : r.en;
      const bars = document.createElement("div");
      bars.className = "bars";
      let slot = 0;
      DATA.cards.forEach(c => {
        const cell = r.cells[c];
        if (!cell || off[c]) return;
        const y = 2 + slot * 13;
        if (cell.v == null) {
          const na = document.createElement("div");
          na.className = "na";
          na.style.top = (y - 2) + "px";
          na.style.left = "2px";
          na.textContent = c + " " + (lang === "zh" ? cell.tz : cell.te) + (cell.n ? " " + cell.n : "");
          na.onmousemove = ev => {
            tip.style.display = "block";
            tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - 360) + "px";
            tip.style.top = (ev.clientY + 12) + "px";
            tip.innerHTML = "<b>" + c + " · " + (lang === "zh" ? cell.tz : cell.te) + "</b>" +
              (cell.n ? "<br>" + DATA.notes[lang][cell.n] : "") +
              (cell.s ? "<br>" + t.source + ": " + cell.s.replace("-comfyui.json", "") : "");
          };
          na.onmouseleave = () => tip.style.display = "none";
          bars.appendChild(na);
        } else {
          const w = Math.max(2, (cell.v / max[k]) * 100);
          const b = document.createElement("div");
          b.className = "bar";
          b.style.cssText = "top:" + y + "px;left:0;width:" + w + "%;background:" + DATA.colors[c];
          const v = document.createElement("div");
          v.className = "val";
          v.style.cssText = "top:" + (y - 2) + "px;left:calc(" + w + "% + 5px)";
          v.textContent = c + " " + fmt(cell.v) + (cell.n ? " " + cell.n : "");
          b.onmousemove = ev => {
            tip.style.display = "block";
            tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - 360) + "px";
            tip.style.top = (ev.clientY + 12) + "px";
            tip.innerHTML = "<b>" + c + " · " + fmt(cell.v) + " s</b><br>" + (lang === "zh" ? cell.tz : cell.te) +
              (cell.n ? "<br>" + DATA.notes[lang][cell.n] : "") +
              (cell.s ? "<br>" + t.source + ": " + cell.s.replace("-comfyui.json", "") : "");
          };
          b.onmouseleave = () => tip.style.display = "none";
          bars.appendChild(b); bars.appendChild(v);
        }
        slot++;
      });
      row.appendChild(lbl); row.appendChild(bars);
      host.appendChild(row);
    });
  });

  const n = document.getElementById("notes");
  const keys = [...new Set(["img", "mus"].flatMap(kk => DATA[kk].flatMap(r => Object.values(r.cells).map(c => c.n).filter(Boolean))))];
  n.innerHTML = keys.map(kk => "· " + kk + " = " + DATA.notes[lang][kk]).join("<br>");
}
document.getElementById("b-zh").onclick = () => { lang = "zh"; render(); };
document.getElementById("b-en").onclick = () => { lang = "en"; render(); };
render();
</script>
</body>
</html>
