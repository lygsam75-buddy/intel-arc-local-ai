<text x="40" y="298" font-size="12.5" fill="#444441">ncmoe 8 is the only value where the two slots tie: 37.13 vs 36.66. At ncmoe 4 the second slot is only 41% of the primary.</text>
<text x="40" y="316" font-size="12" fill="#5F5E5A">Criterion: weight size vs 15.51 GiB — if it does not fit, use ncmoe 8.</text>
