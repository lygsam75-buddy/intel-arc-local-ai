<text x="28" y="454" font-size="11" fill="#5F5E5A">Per-step gap <tspan font-weight="700" fill="#2C2C2A">+11.8–+27.5%</tspan>, end-to-end <tspan font-weight="700" fill="#2C2C2A">+7.4–+23.5%</tspan>; not proportional</text>
<text x="28" y="472" font-size="11" fill="#5F5E5A">across tiers — read each tier, do not scale one from another.</text>
<text x="28" y="490" font-size="11" fill="#5F5E5A">Energy drops just 2.7–4.9%: 18% less power against 7.4–23.5% more</text>
<text x="28" y="508" font-size="11" fill="#5F5E5A">time — a wash. <tspan font-weight="700" fill="#2C2C2A">What BS buys is the single slot and lower heat, not the power bill.</tspan></text>
<text x="28" y="526" font-size="11" fill="#5F5E5A">TF energy was not captured for 480p·10 and 720p·15; those two groups show a BS bar only.</text>
<text x="28" y="548" font-size="10.5" fill="#8A8880">End-to-end uses the fresh round, same basis as the product page</text>
